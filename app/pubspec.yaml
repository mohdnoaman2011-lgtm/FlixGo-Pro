name: flixgo
description: FlixGo downloader
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  open_filex: ^4.5.0
  gal: ^2.3.0
  flutter_local_notifications: ^17.2.4
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo_mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#050509"
  adaptive_icon_foreground: assets/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#050509"
  image: assets/logo.png
  android_12:
    color: "#050509"
    image: assets/icon_foreground.png
