name: Build FlixGo

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # لرفع الملفات إلى صفحة الإصدارات عند وسم v*

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # فحص مبكر برسالة واضحة إن كان رفع الملفات ناقصاً
      - name: Check project files
        run: |
          missing=0
          for f in pubspec.yaml assets/flixgo_logo.png \
            lib/main.dart lib/shell.dart lib/theme.dart lib/utils.dart \
            lib/models/download_task.dart \
            lib/services/download_manager.dart lib/services/notifier.dart lib/services/resolver.dart lib/services/settings.dart \
            lib/screens/home_screen.dart lib/screens/downloads_screen.dart lib/screens/library_screen.dart lib/screens/settings_screen.dart \
            lib/widgets/panel.dart; do
            if [ ! -f "$f" ]; then echo "::error::ملف ناقص في المستودع: $f"; missing=1; fi
          done
          if [ ! -d android_res ]; then
            echo "::warning::المجلد android_res غير موجود، سيُبنى التطبيق بأيقونة Flutter الافتراضية وبدون أيقونة إشعار FlixGo"
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::ارفع محتوى المجلد flixgo_flutter كاملاً إلى جذر المستودع (يجب أن يكون pubspec.yaml في الجذر)"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المشروع يحتوي كود Dart فقط؛ نولّد مجلد android/ إن لم يكن موجوداً
      - name: Generate android/ folder
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.flixgo --project-name flixgo .
          fi

      # إعداد أندرويد (صلاحيات، اسم التطبيق، إشعارات، أيقونات، توقيع). مضمّن هنا ليعمل دون أي ملفات إضافية.
      - name: Configure Android
        run: |
          python3 - <<'PY'
          import re
          import shutil
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          ANDROID = ROOT / "android"
          MANIFEST = ANDROID / "app/src/main/AndroidManifest.xml"
          RES_SRC = ROOT / "android_res"
          RES_DST = ANDROID / "app/src/main/res"

          APP_LABEL = "FlixGo"

          PERMISSIONS = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>',
          ]

          SERVICE = """    <service
                  android:name="com.dexterous.flutterlocalnotifications.ForegroundService"
                  android:exported="false"
                  android:foregroundServiceType="dataSync"
                  android:stopWithTask="false"/>
          """

          KTS_IMPORTS = """import java.io.FileInputStream
          import java.util.Properties

          """

          KTS_HEADER = """val keystoreProperties = Properties().apply {
              val f = rootProject.file("key.properties")
              if (f.exists()) load(FileInputStream(f))
          }

          """

          GROOVY_HEADER = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """

          KTS_SIGNING = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

          """

          GROOVY_SIGNING = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }

          """


          NETWORK_SECURITY = """<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <!-- يسمح بـ HTTP للخادم المحلي على الهاتف فقط؛ بقية الاتصالات تبقى HTTPS -->
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          """


          def log(msg):
              print(msg)


          def patch_manifest():
              if not MANIFEST.exists():
                  sys.exit(f"لم أجد {MANIFEST}. شغّل أولاً: flutter create --platforms=android --org com.flixgo --project-name flixgo .")
              text = MANIFEST.read_text(encoding="utf-8")
              orig = text

              # الصلاحيات (قبل <application)
              missing = [p for p in PERMISSIONS if re.search(re.escape(re.search(r'android:name="([^"]+)"', p).group(1)), text) is None]
              if missing:
                  block = "\n".join("    " + p for p in missing) + "\n"
                  text = re.sub(r"(\s*)<application", lambda m: "\n" + block + "    <application", text, count=1)

              # اسم التطبيق
              text = re.sub(r'(<application[^>]*?android:label=")[^"]*(")', rf"\g<1>{APP_LABEL}\g<2>", text, count=1, flags=re.S)

              # السماح بالاتصال بالخادم المحلي (HTTP) على 127.0.0.1 فقط
              nsc = RES_DST / "xml" / "network_security_config.xml"
              nsc.parent.mkdir(parents=True, exist_ok=True)
              nsc.write_text(NETWORK_SECURITY, encoding="utf-8")
              if "networkSecurityConfig" not in text:
                  text = re.sub(r"(<application\b)", r'\1 android:networkSecurityConfig="@xml/network_security_config"', text, count=1)

              # خدمة الإشعارات
              if "flutterlocalnotifications.ForegroundService" not in text:
                  text = text.replace("</application>", SERVICE + "    </application>", 1)

              if text != orig:
                  MANIFEST.write_text(text, encoding="utf-8")
                  log("✓ AndroidManifest.xml")
              else:
                  log("• AndroidManifest.xml (لا تغيير)")


          def patch_gradle():
              kts = ANDROID / "app/build.gradle.kts"
              groovy = ANDROID / "app/build.gradle"
              if kts.exists():
                  path, is_kts = kts, True
              elif groovy.exists():
                  path, is_kts = groovy, False
              else:
                  sys.exit("لم أجد android/app/build.gradle(.kts)")

              text = path.read_text(encoding="utf-8")
              orig = text

              # 1) desugaring
              if "coreLibraryDesugaring" not in text:
                  flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
                  if re.search(r"compileOptions\s*\{", text):
                      text = re.sub(r"(compileOptions\s*\{)", r"\1\n        " + flag, text, count=1)
                  else:
                      text = re.sub(r"(\nandroid\s*\{)", r"\1\n    compileOptions {\n        " + flag + "\n    }", text, count=1)
                  dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts
                         else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
                  if re.search(r"^dependencies\s*\{", text, flags=re.M):
                      text = re.sub(r"(^dependencies\s*\{)", r"\1\n    " + dep, text, count=1, flags=re.M)
                  else:
                      text = text.rstrip() + f"\n\ndependencies {{\n    {dep}\n}}\n"

              # 2) التوقيع
              if "keystoreProperties" not in text:
                  header = KTS_HEADER if is_kts else GROOVY_HEADER
                  signing = KTS_SIGNING if is_kts else GROOVY_SIGNING
                  # يجب أن يبقى plugins {} أول جملة؛ لذا نضع التعريف قبل android { لا في أول الملف
                  text = re.sub(r"(\nandroid\s*\{)", "\n" + header.rstrip("\n") + "\n" + r"\1", text, count=1)
                  if is_kts:
                      text = KTS_IMPORTS + text
                  text = re.sub(r"(\n\s*buildTypes\s*\{)", "\n" + signing.rstrip("\n") + r"\1", text, count=1)
                  if is_kts:
                      text = re.sub(
                          r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                          'signingConfig = if (keystoreProperties.getProperty("storeFile") != null) '
                          'signingConfigs.getByName("release") else signingConfigs.getByName("debug")',
                          text,
                      )
                  else:
                      text = re.sub(
                          r"signingConfig\s*=?\s*signingConfigs\.debug",
                          "signingConfig keystoreProperties['storeFile'] ? signingConfigs.release : signingConfigs.debug",
                          text,
                      )

              if text != orig:
                  path.write_text(text, encoding="utf-8")
                  log(f"✓ {path.relative_to(ROOT)}")
              else:
                  log(f"• {path.relative_to(ROOT)} (لا تغيير)")


          def copy_res():
              if not RES_SRC.exists():
                  log("• android_res/ غير موجود؛ تخطّيت الأيقونات")
                  return
              n = 0
              for src in RES_SRC.rglob("*"):
                  if src.is_file():
                      dst = RES_DST / src.relative_to(RES_SRC)
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
                      n += 1
              # أيقونة Flutter الافتراضية القديمة قد تتعارض مع النسخة التكيفية (نفس الاسم بصيغتين)
              for d in RES_DST.glob("mipmap-*"):
                  for stale in d.glob("ic_launcher.webp"):
                      stale.unlink()
              log(f"✓ نُسخ {n} ملف أيقونة إلى res/")


          if __name__ == "__main__":
              patch_manifest()
              patch_gradle()
              copy_res()
              log("\nتم. الخطوة التالية: flutter pub get ثم flutter run")
          PY

      # توقيع النسخة النهائية (اختياري): أضف الأسرار في Settings → Secrets and variables → Actions
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
      # بدونها يُوقَّع الملف بمفتاح التطوير (يصلح للتجربة فقط، لا للنشر في المتجر)
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=release.jks"
            } > android/key.properties
            echo "Release signing enabled"
          else
            echo "No keystore secrets found; using debug signing"
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # تحميل NDK من خوادم Google ينقطع أحياناً ("unknown archive")؛ نعيد المحاولة بعد حذف الملف التالف
      - name: Build APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "::warning::فشلت المحاولة $i من 3؛ قد يكون سببها انقطاع تحميل أدوات أندرويد. سأعيد المحاولة."
            rm -rf "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/28.2.13676358 \
                   "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/.temp \
                   "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/.downloadIntermediates
            sleep 10
          done
          exit 1

      - name: Build App Bundle
        run: |
          for i in 1 2 3; do
            flutter build appbundle --release && exit 0
            echo "::warning::فشلت المحاولة $i من 3؛ سأعيد المحاولة."
            sleep 10
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: flixgo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flixgo-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
