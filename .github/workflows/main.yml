name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and build
        run: |
          flutter create --org com.flixgo --project-name myapp --platforms android app
          cp main.dart app/lib/main.dart
          mkdir -p app/assets && cp assets/*.png app/assets/
          cd app
          flutter pub add dio path_provider shared_preferences
          flutter pub add dev:flutter_launcher_icons
          python3 - <<'PY'
          p = 'pubspec.yaml'
          s = open(p).read()
          s = s.replace('\nflutter:\n', '\nflutter:\n  assets:\n    - assets/\n', 1)
          s += '\nflutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon.png"\n'
          open(p, 'w').write(s)
          PY
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="myapp"#android:label="FlixGo"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FlixGo
          path: app/build/app/outputs/flutter-apk/app-release.apk
