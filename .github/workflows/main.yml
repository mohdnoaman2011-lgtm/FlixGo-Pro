name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Ø§Ù„Ù…Ø³ØªÙˆØ¯Ø¹ Ù„Ø§ ÙŠØ­ÙˆÙŠ Ù…Ø¬Ù„Ø¯ androidØŒ ÙÙ†ÙˆÙ„Ù‘Ø¯Ù‡ Ù…Ø¹ Ø§Ù„Ø­ÙØ§Ø¸ Ø¹Ù„Ù‰ ÙƒÙˆØ¯Ù†Ø§
      - name: Create Android platform files
        run: |
          cp -r lib /tmp/lib && cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --project-name flixgo --org com.flixgo --platforms=android
          rm -rf lib test && cp -r /tmp/lib lib && cp /tmp/pubspec.yaml pubspec.yaml

      - name: Add permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      # Ù…Ø·Ù„ÙˆØ¨ Ù„Ø­Ø²Ù…Ø© Ø§Ù„Ø¥Ø´Ø¹Ø§Ø±Ø§Øª flutter_local_notifications
      - name: Enable core library desugaring
        run: |
          sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts

      - run: flutter pub get

      - name: Generate icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE=${{ secrets.API_BASE }}
          --dart-define=API_KEY=${{ secrets.API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: flixgo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk